services:
  redis:
    image: redis:7-alpine
    ports:
       - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  app1:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy